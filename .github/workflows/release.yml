name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # lets the job sign in to NuGet (trusted publishing) and the MCP Registry as this repository

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ vars.NUGET_USER }} # nuget.org account that owns the trusted publishing policy
      MCP_PUBLISHER_VERSION: v1.8.16

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the project and server.json versions
        run: |
          version=$(dotnet msbuild src/DocsRagMcp -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the project version $version"
            exit 1
          fi
          if [ "$(grep -c "\"version\": \"$version\"" src/DocsRagMcp/.mcp/server.json)" != "2" ]; then
            echo "::error::src/DocsRagMcp/.mcp/server.json doesn't use version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/DocsRagMcp -c Release -o artifacts

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      # Trusted publishing: exchanges this workflow's GitHub token for a NuGet API key that expires after an hour.
      - name: Sign in to NuGet
        id: nuget-login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to NuGet
        if: env.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The registry checks the package README on nuget.org, which appears only after NuGet's validation.
      - name: Wait for the package on nuget.org
        if: env.NUGET_USER != ''
        run: |
          url="https://api.nuget.org/v3-flatcontainer/docsragmcp/$VERSION/readme"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null "$url"; then
              echo "Package $VERSION is available."
              exit 0
            fi
            echo "Not available yet ($attempt/60), waiting 30 seconds..."
            sleep 30
          done
          echo "::error::DocsRagMcp $VERSION didn't appear on nuget.org within 30 minutes. Re-run this job later."
          exit 1

      - name: Install cosign
        if: env.NUGET_USER != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: env.NUGET_USER != ''
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        if: env.NUGET_USER != ''
        run: |
          ./mcp-publisher login github-oidc
          cd src/DocsRagMcp/.mcp
          ../../../mcp-publisher publish
